services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scorely_db}
      POSTGRES_USER: ${POSTGRES_USER:-scorely_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scorely_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scorely_user} -d ${POSTGRES_DB:-scorely_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
