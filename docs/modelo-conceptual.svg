<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" height="560" style="color:rgb(30, 41, 59)" viewBox="0 0 900 560" width="100%" xmlns="http://www.w3.org/2000/svg">

  <!-- Competition -->
  <rect x="330" y="20" width="240" height="50" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="450" y="50" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Competition</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" font-family="Arial">DRAFT · ACTIVE · FINISHED</text>

  <!-- Arrow -->
  <line x1="450" y1="70" x2="450" y2="95" stroke="currentColor" stroke-width="2"/>
  <polygon points="450,105 444,93 456,93" fill="currentColor"/>

  <!-- CompetitionStage -->
  <rect x="330" y="110" width="240" height="50" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="450" y="140" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">CompetitionStage</text>

  <!-- Split lines -->
  <line x1="450" y1="160" x2="450" y2="170" stroke="currentColor" stroke-width="2"/>
  <line x1="450" y1="170" x2="240" y2="170" stroke="currentColor" stroke-width="2"/>
  <line x1="450" y1="170" x2="660" y2="170" stroke="currentColor" stroke-width="2"/>
  <line x1="240" y1="170" x2="240" y2="180" stroke="currentColor" stroke-width="2"/>
  <line x1="660" y1="170" x2="660" y2="180" stroke="currentColor" stroke-width="2"/>
  <polygon points="240,190 234,178 246,178" fill="currentColor"/>
  <polygon points="660,190 654,178 666,178" fill="currentColor"/>

  <!-- QUALIFIER -->
  <rect x="120" y="190" width="240" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="240" y="215" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">QUALIFIER</text>
  <text x="240" y="235" text-anchor="middle" font-size="13" font-family="Arial">Top N clasifica</text>

  <!-- FINAL -->
  <rect x="540" y="190" width="240" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="660" y="215" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">FINAL</text>
  <text x="660" y="235" text-anchor="middle" font-size="13" font-family="Arial">Ranking independiente</text>

  <!-- Arrows down to Events -->
  <line x1="240" y1="250" x2="240" y2="270" stroke="currentColor" stroke-width="2"/>
  <line x1="660" y1="250" x2="660" y2="270" stroke="currentColor" stroke-width="2"/>
  <polygon points="240,280 234,268 246,268" fill="currentColor"/>
  <polygon points="660,280 654,268 666,268" fill="currentColor"/>

  <!-- Event (Qualifier) -->
  <rect x="120" y="280" width="240" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="240" y="305" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Event</text>
  <text x="240" y="325" text-anchor="middle" font-size="13" font-family="Arial">WOD 1 · WOD 2 · WOD 3</text>

  <!-- Event (Final) -->
  <rect x="540" y="280" width="240" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="660" y="305" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Event</text>
  <text x="660" y="325" text-anchor="middle" font-size="13" font-family="Arial">Final WODs</text>

  <!-- Converge lines to Competitor -->
  <line x1="360" y1="310" x2="420" y2="310" stroke="currentColor" stroke-width="2"/>
  <line x1="540" y1="310" x2="480" y2="310" stroke="currentColor" stroke-width="2"/>
  <line x1="450" y1="340" x2="450" y2="370" stroke="currentColor" stroke-width="2"/>
  <polygon points="450,380 444,368 456,368" fill="currentColor"/>

  <!-- Competitor -->
  <rect x="330" y="380" width="240" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="450" y="405" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Competitor</text>
  <text x="450" y="425" text-anchor="middle" font-size="13" font-family="Arial">Individual o Team</text>

  <!-- Lines to Athlete / Team -->
  <line x1="330" y1="410" x2="220" y2="410" stroke="currentColor" stroke-width="2"/>
  <line x1="570" y1="410" x2="680" y2="410" stroke="currentColor" stroke-width="2"/>

  <!-- Athlete -->
  <rect x="40" y="380" width="180" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="130" y="405" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Athlete</text>
  <text x="130" y="425" text-anchor="middle" font-size="13" font-family="Arial">Atleta real</text>

  <!-- Team -->
  <rect x="680" y="380" width="180" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="770" y="405" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Team</text>
  <text x="770" y="425" text-anchor="middle" font-size="13" font-family="Arial">Miembros</text>

  <!-- Arrow down to EventCompetitor -->
  <line x1="450" y1="440" x2="450" y2="475" stroke="currentColor" stroke-width="2"/>
  <polygon points="450,485 444,473 456,473" fill="currentColor"/>

  <!-- EventCompetitor -->
  <rect x="310" y="490" width="280" height="35" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="450" y="512" text-anchor="middle" font-size="16" font-family="Arial" font-weight="bold">EventCompetitor → Result → Score</text>
</svg>
